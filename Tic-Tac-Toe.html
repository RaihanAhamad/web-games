<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>#️⃣</text></svg>">
    <style>
        :root {
            --bg-color: #f0f0f0;
            --text-color: #1a1a1a;
            --container-bg: #e0e0e0;
            --game-bg: #000000;
            --cell-bg: #ffffff;
            --cell-border: #bbbbbb;
            --card-bg: #ffffff;
            --card-shadow: rgba(0, 0, 0, 0.1);
        }

        [data-theme="dark"] {
            --bg-color: #121212;
            --text-color: #f0f0f0;
            --container-bg: #1e1e1e;
            --game-bg: #333333;
            --cell-bg: #2a2a2a;
            --cell-border: #444444;
            --card-bg: #2a2a2a;
            --card-shadow: rgba(0, 0, 0, 0.5);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            transition: background-color 0.3s, color 0.3s;
        }
        

        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: Arial, sans-serif;
            padding: 20px;
        }

        /* Top Bar: Theme Toggle */
        .top-controls {
            position: absolute;
            top: 20px;
            right: 20px;
        }

        .toggle-btn {
            background-color: var(--card-bg);
            color: var(--text-color);
            border: 2px solid var(--cell-border);
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 2px 5px var(--card-shadow);
        }

        .toggle-btn:hover {
            opacity: 0.9;
        }

        /* Scorecard Styles */
        .scorecard {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            background-color: var(--card-bg);
            padding: 12px 24px;
            border-radius: 10px;
            box-shadow: 0 4px 6px var(--card-shadow);
            border: 1px solid var(--cell-border);
        }

        .score-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            min-width: 60px;
        }

        .score-label {
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 4px;
        }

        .score-value {
            font-size: 20px;
            font-weight: bold;
        }

        /* Main Game Container */
        .game-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        /* Replicating Tkinter Window */
        .window {
            width: 300px;
            height: 300px;
            background-color: var(--container-bg);
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            border-radius: 8px;
            box-shadow: 0 4px 10px var(--card-shadow);
        }

        /* Black Frame inside the window */
        .frame {
            width: 96%;
            height: 96%;
            background-color: var(--game-bg);
            position: relative;
            border-radius: 4px;
        }

        /* Grid buttons and labels */
        .cell {
            position: absolute;
            width: 30%;
            height: 30%;
            font-family: Arial, sans-serif;
            font-size: 25px;
            font-weight: bold;
            border: 2px outset var(--cell-border);
            background-color: var(--cell-bg);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            user-select: none;
        }

        .cell.disabled {
            cursor: default;
            pointer-events: none;
        }

        /* Controls Section Below Game Window */
        .bottom-controls {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 300px;
            gap: 15px;
        }

        .turn-status {
            font-size: 18px;
            font-weight: bold;
            color: var(--text-color);
        }

        /* Restart button */
        .restart-btn {
            background-color: orange;
            color: black;
            border: 2px outset #ffffff;
            padding: 8px 18px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 5px;
            box-shadow: 0 2px 5px var(--card-shadow);
        }

        .restart-btn:hover {
            background-color: #e69500;
        }
    </style>
</head>
<body data-theme="light">

    <div class="top-controls">
        <button class="toggle-btn" id="themeToggle" onclick="toggleTheme()">🌙 Dark Mode</button>
    </div>

    <!-- Scorecard above window -->
    <div class="scorecard">
        <div class="score-box">
            <span class="score-label">O Wins</span>
            <span class="score-value" id="scoreO">0</span>
        </div>
        <div class="score-box">
            <span class="score-label">Draws</span>
            <span class="score-value" id="scoreDraw">0</span>
        </div>
        <div class="score-box">
            <span class="score-label">X Wins</span>
            <span class="score-value" id="scoreX">0</span>
        </div>
    </div>

    <!-- Main Game Section -->
    <div class="game-wrapper">
        <div class="window">
            <div id="frame" class="frame"></div>
        </div>

        <!-- Bottom Bar: Turn Status & Restart Button -->
        <div class="bottom-controls">
            <span class="turn-status" id="turnDisplay">Now O's turn</span>
            <button class="restart-btn" onclick="start()">Restart</button>
        </div>
    </div>

<script>
    // Global Score State
    let scores = {
        O: 0,
        Draw: 0,
        X: 0
    };

    // Web Audio API Synthesizer Sound Generator
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    function playSound(type) {
        if (audioCtx.state === 'suspended') {
            audioCtx.resume();
        }

        const now = audioCtx.currentTime;

        if (type === 'O') {
            // High-pitched pleasant tone for O's move
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(523.25, now); // C5
            gain.gain.setValueAtTime(0.2, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(now);
            osc.stop(now + 0.15);
        } 
        else if (type === 'X') {
            // Deeper punchy tone for X's move
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(329.63, now); // E4
            gain.gain.setValueAtTime(0.25, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(now);
            osc.stop(now + 0.15);
        } 
        else if (type === 'win') {
            // Victory Fanfare Chime (C5 -> E5 -> G5 -> C6)
            const notes = [523.25, 659.25, 783.99, 1046.50];
            notes.forEach((freq, index) => {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(freq, now + index * 0.08);
                gain.gain.setValueAtTime(0.2, now + index * 0.08);
                gain.gain.exponentialRampToValueAtTime(0.01, now + index * 0.08 + 0.25);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(now + index * 0.08);
                osc.stop(now + index * 0.08 + 0.25);
            });
        } 
        else if (type === 'draw') {
            // Descending "bum-bum" tone for Draw
            const notes = [300, 220];
            notes.forEach((freq, index) => {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(freq, now + index * 0.15);
                gain.gain.setValueAtTime(0.15, now + index * 0.15);
                gain.gain.exponentialRampToValueAtTime(0.01, now + index * 0.15 + 0.2);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(now + index * 0.15);
                osc.stop(now + index * 0.15 + 0.2);
            });
        }
    }

    // Dark/Light Mode Switcher
    function toggleTheme() {
        const body = document.body;
        const toggleBtn = document.getElementById('themeToggle');
        if (body.getAttribute('data-theme') === 'light') {
            body.setAttribute('data-theme', 'dark');
            toggleBtn.textContent = '☀️ Light Mode';
        } else {
            body.setAttribute('data-theme', 'light');
            toggleBtn.textContent = '🌙 Dark Mode';
        }
    }

    let btnList = [];
    let boardState = [];
    let sequence = ['X'];
    let moveCount = 0;
    let gameOver = false;

    function start() {
        const frame = document.getElementById('frame');
        frame.innerHTML = ''; 

        btnList = [
            [null, null, null],
            [null, null, null],
            [null, null, null]
        ];
        
        boardState = [
            [null, null, null],
            [null, null, null],
            [null, null, null]
        ];

        sequence = ['X'];
        moveCount = 0;
        gameOver = false;

        // Reset Turn Indicator (First move is O)
        document.getElementById('turnDisplay').textContent = "Now O's turn";

        // Create 3x3 Grid
        for (let i = 0; i < 3; i++) {
            for (let j = 0; j < 3; j++) {
                const btn = document.createElement('div');
                btn.className = 'cell';
                
                // Tkinter layout mapping
                btn.style.left = `${(1/3 * j + 0.016) * 100}%`;
                btn.style.top = `${(1/3 * i + 0.016) * 100}%`;

                btn.addEventListener('click', () => click(i, j, btn));
                
                frame.appendChild(btn);
                btnList[i][j] = btn;
            }
        }
    }

    function allBtnDisable() {
        for (let i = 0; i < 3; i++) {
            for (let j = 0; j < 3; j++) {
                btnList[i][j].classList.add('disabled');
            }
        }
    }

    function updateScoreDisplay() {
        document.getElementById('scoreO').textContent = scores.O;
        document.getElementById('scoreDraw').textContent = scores.Draw;
        document.getElementById('scoreX').textContent = scores.X;
    }

    function click(i, j, btn) {
        if (gameOver) return;

        btn.classList.add('disabled');

        const lastClicked = sequence[sequence.length - 1];
        const txt = (lastClicked === 'X') ? 'O' : 'X';

        // Play move sound
        playSound(txt);

        btn.textContent = txt;
        boardState[i][j] = txt;
        sequence.push(txt);
        moveCount++;

        // Update Turn Indicator for the next turn
        const nextTurn = (txt === 'X') ? 'O' : 'X';
        document.getElementById('turnDisplay').textContent = `Now ${nextTurn}'s turn`;

        check(txt);
    }

    function check(winnerSymbol) {
        let isWin = false;

        // Check Rows
        for (let i = 0; i < 3; i++) {
            if (boardState[i][0] !== null && 
                boardState[i][0] === boardState[i][1] && 
                boardState[i][0] === boardState[i][2]) {
                
                for (let j = 0; j < 3; j++) {
                    btnList[i][j].style.backgroundColor = 'lime';
                    btnList[i][j].style.color = 'black';
                }
                isWin = true;
                break;
            }
        }

        // Check Columns
        if (!isWin) {
            for (let j = 0; j < 3; j++) {
                if (boardState[0][j] !== null && 
                    boardState[0][j] === boardState[1][j] && 
                    boardState[0][j] === boardState[2][j]) {
                    
                    for (let i = 0; i < 3; i++) {
                        btnList[i][j].style.backgroundColor = 'orange';
                        btnList[i][j].style.color = 'black';
                    }
                    isWin = true;
                    break;
                }
            }
        }

        // Check Diagonal
        if (!isWin && boardState[0][0] !== null && 
            boardState[0][0] === boardState[1][1] && 
            boardState[0][0] === boardState[2][2]) {
            
            for (let i = 0; i < 3; i++) {
                btnList[i][i].style.backgroundColor = 'purple';
                btnList[i][i].style.color = 'white';
            }
            isWin = true;
        }

        // Check Anti-Diagonal
        if (!isWin && boardState[1][1] !== null && 
            boardState[1][1] === boardState[0][2] && 
            boardState[1][1] === boardState[2][0]) {
            
            for (let i = 0; i < 3; i++) {
                btnList[i][2 - i].style.backgroundColor = 'magenta';
                btnList[i][2 - i].style.color = 'white';
            }
            isWin = true;
        }

        if (isWin) {
            gameOver = true;
            scores[winnerSymbol]++;
            updateScoreDisplay();
            document.getElementById('turnDisplay').textContent = `${winnerSymbol} Wins!`;
            playSound('win');
            allBtnDisable();
        } else if (moveCount === 9) {
            // Check Draw Condition
            gameOver = true;
            scores.Draw++;
            updateScoreDisplay();
            document.getElementById('turnDisplay').textContent = `It's a Draw!`;
            playSound('draw');
            allBtnDisable();
        }
    }

    // Initial Start
    start();
</script>

</body>
</html>
